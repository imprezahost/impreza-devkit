      parameters:
        - name: serviceId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Restore initiated

  /vps/proxmox/{serviceId}/backups/{id}:
    delete:
      tags: [VPS Proxmox]
      summary: Delete backup
      parameters:
        - name: serviceId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Backup deleted

  /vps/proxmox/{serviceId}/backup-schedules:
    get:
      tags: [VPS Proxmox]
      summary: List backup schedules
      parameters:
        - name: serviceId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Schedule list
    post:
      tags: [VPS Proxmox]
      summary: Create backup schedule
      parameters:
        - name: serviceId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                dow:
                  type: string
                  description: Day of week (mon,tue,wed...)
                hour:
                  type: integer
                minute:
                  type: integer
                mode:
                  type: string
                  enum: [snapshot, suspend, stop]
                compress:
                  type: string
                  enum: [none, lzo, gzip, zstd]
      responses:
        '201':
          description: Schedule created

  /vps/proxmox/{serviceId}/backup-schedules/{id}:
    delete:
      tags: [VPS Proxmox]
