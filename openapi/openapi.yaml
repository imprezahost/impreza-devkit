  # ═══════════════════════════════════════════════════════
  # VPS PROXMOX
  # ═══════════════════════════════════════════════════════

  /vps/proxmox/{serviceId}:
    get:
      tags: [VPS Proxmox]
      summary: Get VM info
      description: Returns hostname, OS, cores, RAM, disk, IPs, location.
      parameters:
        - name: serviceId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: VM information
  /vps/proxmox/{serviceId}/cancel:
    post:
      tags: [VPS Proxmox]
      summary: Request service cancellation
      description: |
        Submits a cancellation request via Impreza Account. The VM is **not** destroyed immediately —
        cancellation is processed by Impreza Account according to the chosen type.
      parameters:
        - name: serviceId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type:
                  type: string
                  enum: [Immediate, End of Billing Period]
                  example: End of Billing Period
                reason:
                  type: string
                  description: Optional cancellation reason
                  example: No longer needed
      responses:
        '200':
          description: Cancellation request submitted
          content:
            application/json:
              example:
                success: true
                data:
                  service_id: 123
                  cancel_type: "End of Billing Period"
                  message: "Cancellation request submitted successfully."

  /vps/proxmox/{serviceId}/status:
    get:
      tags: [VPS Proxmox]
      summary: Get VM status
      description: Power state, CPU%, memory, uptime.
      parameters:
        - name: serviceId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: VM status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/VpsStatus'

  /vps/proxmox/{serviceId}/resources:
    get:
      tags: [VPS Proxmox]
      summary: Get resource usage
      description: CPU, memory, disk I/O, network statistics.
      parameters:
        - name: serviceId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Resource usage

  /vps/proxmox/{serviceId}/config:
    get:
