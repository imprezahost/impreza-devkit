            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm:
                  type: boolean
      responses:
        '200':
          description: Rollback initiated

  /vps/proxmox/{serviceId}/available-ips:
