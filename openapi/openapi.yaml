        - name: serviceId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Backup list
    post:
      tags: [VPS Proxmox]
      summary: Create backup
      parameters:
        - name: serviceId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '201':
          description: Backup created

  /vps/proxmox/{serviceId}/backups/{id}/restore:
    post:
      tags: [VPS Proxmox]
      summary: Restore backup
