openapi: 3.1.0
info:
  title: Impreza Host Public API
  description: |
    Official REST API for Impreza Host clients. Manage domains, hosting, VPS, email services, and place orders programmatically.

    ## Companion event API

    Push notifications are documented separately in
    [`asyncapi.yaml`](./asyncapi.yaml) (AsyncAPI 3.0). Subscribe via
    `POST /v1/webhooks` here; receive events on your URL as documented
    there.

    ## Authentication

    All requests require two headers:
    - `X-API-Key` — Your API key (starts with `imp_`)
    - `X-API-Secret` — Your API secret (shown once when generated)

    Generate keys in your [Impreza Account → API Management](https://portal.imprezahost.com/imprezaapi.php).

    ## IP Whitelist

    Your request IP must be whitelisted before making API calls. Add IPs in the API Management page.

    ## Rate Limiting

    Default: **60 requests per minute** per API key. Response headers:
    - `X-RateLimit-Limit` — Max requests per minute
    - `X-RateLimit-Remaining` — Remaining requests in current window
    - `X-RateLimit-Reset` — Unix timestamp when the window resets

    ## Destructive Operations

    Irreversible actions (reinstall, terminate, rollback) require `"confirm": true` in the request body.

    ## Errors

    All errors follow a consistent format:
    ```json
    {
      "success": false,
      "error": {
        "code": "ERROR_CODE",
        "message": "Human-readable description"
      },
      "meta": { "request_id": "req_abc123", "timestamp": "2026-03-30T14:00:00Z" }
    }
    ```
  version: 1.0.0
  contact:
    name: Impreza Host Support
    url: https://imprezahost.com
  license:
    name: Proprietary

servers:
  - url: https://api.imprezahost.com/v1
    description: Production

security:
  - ApiKey: []
    ApiSecret: []

tags:
  - name: Account
    description: Client account information and services
  - name: Products
    description: Product catalog with pricing (VPS, hosting, domains)
  - name: Orders
    description: Create orders and upgrades (paid from balance)
  - name: Invoices
    description: List, view, and pay invoices from account balance
  - name: Services
    description: Service management (cancellation)
  - name: Domains
    description: Domain pricing, registration, transfer, DNS, nameservers, locks
  - name: Hosting
    description: cPanel/WHM hosting management
  - name: Titan Email
    description: Titan Email service management
  - name: Google Workspace
    description: Google Workspace management
  - name: VPS Proxmox
    description: Proxmox VPS management (31+ operations)
  - name: VPS Cloud
    description: Cloud VPS management (27+ operations)
  - name: Webhooks
    description: Subscribe to events delivered as HMAC-signed POSTs

components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: Your API key (e.g. `imp_a1b2c3d4...`)
    ApiSecret:
      type: apiKey
      in: header
      name: X-API-Secret
      description: Your API secret

  schemas:
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
        meta:
          $ref: '#/components/schemas/Meta'

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: INVALID_REQUEST
            message:
              type: string
              example: "Field 'hostname' is required."
            details:
              type: object
        meta:
          $ref: '#/components/schemas/Meta'

    Meta:
      type: object
      properties:
        request_id:
          type: string
          example: req_a1b2c3d4e5f6g7h8
        timestamp:
          type: string
          format: date-time
          example: "2026-03-30T14:05:00Z"

    AccountInfo:
      type: object
      properties:
        id:
          type: integer
          example: 1234
        first_name:
          type: string
          example: John
        last_name:
          type: string
          example: Doe
        company:
          type: string
          example: ACME Corp
        email:
          type: string
          example: john@example.com
        balance:
          type: number
          format: float
          example: 150.00
        currency:
          type: string
          example: USD
        registered_at:
          type: string
          example: "2024-01-15"

    Service:
      type: object
      properties:
        id:
          type: integer
          example: 567
        domain:
          type: string
          example: example.com
        status:
          type: string
          enum: [Active, Suspended, Terminated, Pending, Cancelled]
          example: Active
        product:
          type: string
          example: VPS Plan 2
        product_group:
          type: string
          example: VPS Hosting
        billing_cycle:
          type: string
          example: monthly
        amount:
          type: number
          example: 15.00
        dedicated_ip:
          type: string
          example: 185.100.86.42
        registered_at:
          type: string
          example: "2024-06-01"
        next_due:
          type: string
          example: "2026-04-01"
        vps_backend:
          type: [string, "null"]
          enum: [proxmox, cloud, null]
          description: |
            Stable backend identifier for VPS services, exposed so SDKs can
            smart-dispatch between `/vps/proxmox/...` and `/vps/cloud/...`
            without parsing the human-readable `product_group`. `null` for
            non-VPS services or when the underlying server module is not
            recognized.
          example: proxmox

    Order:
      type: object
      properties:
        id:
          type: integer
          example: 890
        order_number:
          type: string
          example: "4829174"
        date:
          type: string
          example: "2026-03-30"
        amount:
          type: number
          example: 15.00
        invoice_id:
          type: integer
          example: 2345
        status:
          type: string
          example: Active
        payment_method:
          type: string
          example: mailin

    DnsRecord:
      type: object
      properties:
        type:
          type: string
          enum: [A, AAAA, CNAME, MX, TXT, NS, SRV]
          example: A
        host:
          type: string
          example: "@"
        value:
          type: string
          example: "185.100.86.42"
        ttl:
          type: integer
          example: 14400
        priority:
          type: [integer, "null"]
          example: null

    VpsStatus:
      type: object
      properties:
        power_state:
          type: string
          example: running
        cpu_usage:
          type: number
          example: 12.5
        memory_used:
          type: integer
          example: 1073741824
        memory_total:
          type: integer
          example: 4294967296
        uptime:
          type: integer
          description: Uptime in seconds
          example: 864000

  responses:
    Unauthorized:
      description: Invalid or missing API credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: UNAUTHORIZED
              message: Invalid API key.
            meta:
              request_id: req_abc123
              timestamp: "2026-03-30T14:05:00Z"

    Forbidden:
      description: IP not whitelisted or resource not owned
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    RateLimited:
      description: Rate limit exceeded
      headers:
        Retry-After:
          schema:
            type: integer
            example: 60
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: RATE_LIMITED
              message: "Rate limit exceeded. Maximum 60 requests per minute."

    UpstreamError:
      description: Error from upstream provider API
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    BadRequest:
      description: Validation failed on the request body or query parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: INVALID_REQUEST
              message: "Field 'amount' must be a positive number."

    Conflict:
      description: Request would violate a unique constraint or state precondition
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: CONFLICT
              message: "Resource is in a state that does not allow this operation."

    InternalError:
      description: Unexpected server-side error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: INTERNAL_ERROR
              message: "An unexpected error occurred. Please retry; if it persists, contact support."

    InsufficientCredit:
      description: Action requires more account balance than available
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: INSUFFICIENT_CREDIT
              message: "Insufficient account balance. Top up with `impreza account topup`."

paths:
  # ═══════════════════════════════════════════════════════
  # ACCOUNT
  # ═══════════════════════════════════════════════════════

  /account:
    get:
      tags: [Account]
      summary: Get account information
      description: Returns client profile, balance, and currency.
      responses:
        '200':
          description: Account info
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/AccountInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /account/services:
    get:
      tags: [Account]
      summary: List all services
      description: Returns all services (hosting, VPS, domains) for the authenticated client.
      parameters:
        - name: status
          in: query
          description: Filter by status
          schema:
            type: string
            enum: [Active, Suspended, Terminated, Pending, Cancelled]
      responses:
        '200':
          description: Service list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        type: object
                        properties:
                          services:
                            type: array
                            items:
                              $ref: '#/components/schemas/Service'
                          total:
                            type: integer

  /account/services/{id}:
    get:
      tags: [Account]
      summary: Get service details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Service details including server info and nameservers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /account/topup:
    post:
      tags: [Account]
      summary: Create a crypto top-up invoice
      description: |
        Generates an `AddFunds` invoice routed to the `btcpayinline`
        gateway. Open `payment_url` to complete payment with Bitcoin (BTC),
        Monero (XMR), TRX, or USDT-TRC20. Once the gateway confirms payment,
        the client account balance is credited automatically.

        Use `GET /account/topup/{invoice_id}` to poll status.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount:
                  type: number
                  format: float
                  minimum: 1
                  maximum: 10000
                  description: Amount in the client's account currency.
                  example: 50.00
                method:
                  type: string
                  enum: [btc, xmr, trx, usdt, usdt_trc20]
                  description: |
                    Optional preferred payment method. Forwarded to the gateway
                    as a hint; the gateway may still display alternatives if the
                    preferred method is unavailable.
                  example: xmr
      responses:
        '201':
          description: Top-up invoice created successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          invoice_id:
                            type: integer
                            example: 12345
                          amount:
                            type: number
                            format: float
                            example: 50.00
                          currency:
                            type: string
                            example: USD
                          method:
                            type: [string, "null"]
                            example: xmr
                          status:
                            type: string
                            enum: [pending, paid, cancelled, refunded]
                            example: pending
                          payment_url:
                            type: string
                            format: uri
                            example: https://portal.imprezahost.com/viewinvoice.php?id=12345&method=xmr
                          expires_at:
                            type: string
                            format: date-time
                            example: '2026-05-08T16:30:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /account/topup/{invoice_id}:
    get:
      tags: [Account]
      summary: Get top-up invoice status
      description: |
        Poll this endpoint to check if a top-up invoice has been paid.
        Returns 404 if the invoice is not an `AddFunds` invoice or does
        not belong to the authenticated client.
      parameters:
        - name: invoice_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Top-up invoice status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          invoice_id:
                            type: integer
                            example: 12345
                          amount:
                            type: number
                            format: float
                            example: 50.00
                          currency:
                            type: string
                            example: USD
                          method:
                            type: [string, "null"]
                            example: xmr
                          status:
                            type: string
                            enum: [pending, paid, cancelled, refunded]
                            example: paid
                          paid_at:
                            type: [string, "null"]
                            format: date-time
                            example: '2026-05-08T15:42:00Z'
                          balance_after:
                            type: number
                            format: float
                            description: Present only when status is `paid`.
                            example: 95.32
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /account/api-keys/self:
    get:
      tags: [Account]
      summary: Identity and IP whitelist of the API key making this request
      description: |
        Returns metadata about the API key that authenticated this call. The
        full `api_key` value is never returned — only the public `prefix`
        (the first 12 chars). The `request_ip` is the IP that the server
        observed for this call (useful when debugging why a different IP than
        expected is being whitelisted).

        Used by clients implementing `impreza key whoami`.
      responses:
        '200':
          description: Key identity
          content:
            application/json:
              example:
                success: true
                data:
                  id: 42
                  client_id: 123
                  prefix: 'imp_a1b2c3d4'
                  label: 'CI server'
                  status: 'active'
                  last_used_at: '2026-05-08T15:42:00Z'
                  created_at: '2026-04-01T10:00:00Z'
                  rate_limit_per_minute: 60
                  request_ip: '203.0.113.50'
                  ip_whitelist:
                    - id: 1
                      ip_address: '203.0.113.50'
                      label: 'CI'
                      created_at: '2026-04-01T10:01:00Z'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ═══════════════════════════════════════════════════════
  # PRODUCTS
  # ═══════════════════════════════════════════════════════

  /products:
    get:
      tags: [Products]
      summary: List all available products
      description: |
        Returns all available products grouped by category with pricing per billing cycle.
        Prices are shown in the authenticated client's currency.
      parameters:
        - name: group
          in: query
          description: Filter by product group name (e.g. "VPS", "Hosting")
          schema:
            type: string
        - name: type
          in: query
          description: Filter by product type
          schema:
            type: string
            enum: [hostingaccount, reselleraccount, server, other]
      responses:
        '200':
          description: Product catalog
          content:
            application/json:
              example:
                success: true
                data:
                  products:
                    - id: 15
                      name: "VPS Plan 2"
                      description: "4 vCPU, 8GB RAM, 100GB SSD"
                      type: server
                      group: "VPS Hosting"
                      group_id: 3
                      currency: USD
                      pricing:
                        monthly: { price: 15.00, setup_fee: 0.00 }
                        quarterly: { price: 40.00, setup_fee: 0.00 }
                        annually: { price: 144.00, setup_fee: 0.00 }
                  total: 12
                  currency: USD

  /products/groups:
    get:
      tags: [Products]
      summary: List product groups
      description: Returns all product groups with the number of available products in each.
      responses:
        '200':
          description: Product groups
          content:
            application/json:
              example:
                success: true
                data:
                  groups:
                    - { id: 1, name: "Shared Hosting", product_count: 4 }
                    - { id: 3, name: "VPS Hosting", product_count: 6 }
                    - { id: 5, name: "Dedicated Servers", product_count: 3 }
                  total: 3

  /products/{id}:
    get:
      tags: [Products]
      summary: Get product details
      description: |
        Returns a single product with full pricing per billing cycle, setup fees,
        custom fields, and configurable options (e.g. OS template) required for ordering.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Product details with pricing, custom fields, and configurable options
          content:
            application/json:
              example:
                success: true
                data:
                  id: 15
                  name: "VPS Plan 2"
                  description: "4 vCPU, 8GB RAM, 100GB SSD"
                  type: server
                  group: "VPS Hosting"
                  group_id: 3
                  currency: USD
                  pricing:
                    monthly: { price: 15.00, setup_fee: 0.00 }
                    annually: { price: 144.00, setup_fee: 0.00 }
                  custom_fields:
                    - { id: 1, name: "Hostname", type: "text", required: true }
                  config_options:
                    - id: 5
                      name: "Operating System"
                      type: 1
                      options:
                        - { id: 10, name: "Ubuntu 22.04", pricing: { monthly: 0.00 } }
                        - { id: 11, name: "Debian 12", pricing: { monthly: 0.00 } }
                        - { id: 12, name: "Windows Server 2022", pricing: { monthly: 5.00 } }
        '404':
          $ref: '#/components/responses/NotFound'

  # ═══════════════════════════════════════════════════════
  # ORDERS
  # ═══════════════════════════════════════════════════════

  /orders:
    get:
      tags: [Orders]
      summary: List orders
      responses:
        '200':
          description: Order list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        type: object
                        properties:
                          orders:
                            type: array
                            items:
                              $ref: '#/components/schemas/Order'
                          total:
                            type: integer

    post:
      tags: [Orders]
      summary: Create a new order
      description: |
        Creates a new order and pays from account credit balance.
        If the balance is insufficient, returns `409 INSUFFICIENT_BALANCE`.

        Use `GET /products/{id}` to discover available `config_options` (e.g. OS template,
        number of email accounts) and `custom_fields` for the product before placing an order.

        ### Examples

        **VPS with OS template:**
        ```json
        {
          "product_id": 15,
          "billing_cycle": "monthly",
          "hostname": "my-vps",
          "config_options": { "5": "10" }
        }
        ```

        **Titan Email with 5 accounts:**
        ```json
        {
          "product_id": 20,
          "billing_cycle": "annually",
          "domain": "example.com",
          "config_options": { "8": "5" }
        }
        ```

        **Google Workspace with 3 seats:**
        ```json
        {
          "product_id": 25,
          "billing_cycle": "annually",
          "domain": "example.com",
          "config_options": { "12": "3" }
        }
        ```
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product_id, billing_cycle]
              properties:
                product_id:
                  type: integer
                  description: Product ID from Impreza Account
                  example: 15
                billing_cycle:
                  type: string
                  enum: [monthly, quarterly, semiannually, annually, biennially, triennially]
                  example: monthly
                domain:
                  type: string
                  description: Domain for the service (if applicable)
                  example: myserver.com
                hostname:
                  type: string
                  description: Hostname for VPS services
                  example: my-vps
                config_options:
                  type: object
                  description: |
                    Configurable options (e.g. OS template). Object keys are option IDs,
                    values are the selected sub-option IDs. Get available options from `GET /products/{id}`.
                  example: { "5": "10" }
                custom_fields:
                  type: object
                  description: |
                    Custom field values. Object keys are field IDs, values are the field values.
                    Get available fields from `GET /products/{id}`.
                  example: { "1": "myserver.example.com" }
      responses:
        '201':
          description: Order created successfully
          content:
            application/json:
              example:
                success: true
                data:
                  order_id: 890
                  invoice_id: 2345
                  product: "VPS Plan 2"
                  amount: 15.00
                  status: Active
                  message: "Order created and paid from account balance."
        '400':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Insufficient balance
          content:
            application/json:
              example:
                success: false
                error:
                  code: INSUFFICIENT_BALANCE
                  message: "Insufficient balance. Required: $15.00, Available: $3.50"

  /orders/{id}:
    get:
      tags: [Orders]
      summary: Get order details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Order details with items
        '404':
          $ref: '#/components/responses/NotFound'

  /orders/{id}/upgrade:
    post:
      tags: [Orders]
      summary: Upgrade a service
      description: Creates an upgrade order paid from account credit balance.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [service_id, new_product_id, billing_cycle]
              properties:
                service_id:
                  type: integer
                  example: 567
                new_product_id:
                  type: integer
                  example: 25
                billing_cycle:
                  type: string
                  example: monthly
      responses:
        '201':
          description: Upgrade created
        '409':
          description: Insufficient balance

  # ═══════════════════════════════════════════════════════
  # INVOICES
  # ═══════════════════════════════════════════════════════

  /invoices:
    get:
      tags: [Invoices]
      summary: List invoices
      description: |
        Returns all invoices for the authenticated client.
        Use `?status=Unpaid` to filter only unpaid invoices (e.g. pending renewals).
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [Paid, Unpaid, Cancelled, Refunded]
          description: Filter by invoice status
      responses:
        '200':
          description: Invoice list
          content:
            application/json:
              example:
                success: true
                data:
                  invoices:
                    - id: 2345
                      invoice_num: "2345"
                      date: "2026-03-01"
                      due_date: "2026-03-15"
                      date_paid: null
                      subtotal: 17.00
                      credit: 0.00
                      tax: 0.00
                      total: 17.00
                      status: Unpaid
                      payment_method: banktransfer
                  total: 1

  /invoices/{id}:
    get:
      tags: [Invoices]
      summary: Get invoice details
      description: Returns invoice details including line items and transaction history.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Invoice details with items and transactions
          content:
            application/json:
              example:
                success: true
                data:
                  id: 2345
                  invoice_num: "2345"
                  date: "2026-03-01"
                  due_date: "2026-03-15"
                  total: 17.00
                  status: Unpaid
                  items:
                    - id: 1
                      type: Hosting
                      description: "VPS Plan 2 - Monthly (03/15/2026 - 04/14/2026)"
                      amount: 17.00
                      taxed: false
                  transactions: []
        '404':
          $ref: '#/components/responses/NotFound'

  /invoices/{id}/pay:
    post:
      tags: [Invoices]
      summary: Pay invoice from balance
      description: |
        Pays an unpaid invoice using the client's account credit balance.
        This is the recommended way to handle renewals — the system generates
        renewal invoices automatically, and the client pays them via this endpoint.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Invoice paid successfully
          content:
            application/json:
              example:
                success: true
                data:
                  invoice_id: 2345
                  amount: 17.00
                  currency: USD
                  message: "Invoice paid from account balance."
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Already paid or insufficient balance
          content:
            application/json:
              examples:
                already_paid:
