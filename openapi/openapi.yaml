                    error:
                      code: ALREADY_PAID
                      message: "This invoice is already paid."
                insufficient_balance:
                  value:
                    success: false
                    error:
                      code: INSUFFICIENT_BALANCE
                      message: "Insufficient balance. Required: USD 17.00, Available: USD 5.00"

  # ═══════════════════════════════════════════════════════
  # SERVICES
  # ═══════════════════════════════════════════════════════

  /services/{id}/cancel:
