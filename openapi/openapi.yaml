                  service_id: 567
                  cancel_type: "End of Billing Period"
                  message: "Cancellation request submitted successfully."

  # ═══════════════════════════════════════════════════════
  # WEBHOOKS
  # ═══════════════════════════════════════════════════════

  /webhooks:
    get:
      tags: [Webhooks]
      summary: List webhook subscriptions
      description: Returns every webhook subscription owned by the authenticated client.
      responses:
        '200':
          description: List of subscriptions
          content:
            application/json:
              example:
                success: true
                data:
                  webhooks:
                    - id: 1
                      url: https://example.com/hooks/impreza
                      events: [vps.power_state_changed, invoice.paid]
                      description: production handler
                      is_active: true
                      last_delivery_at: '2026-05-08T15:42:00Z'
                      last_delivery_status: 200
                      created_at: '2026-05-01T10:00:00Z'
                  total: 1
    post:
      tags: [Webhooks]
      summary: Create a webhook subscription
      description: |
        Creates a subscription that receives `application/json` `POST` requests
        for the chosen event types. Each delivery includes:

        - `X-Impreza-Signature: sha256=<hex>` — HMAC-SHA256 of the raw body
          using the subscription's `secret`.
        - `X-Impreza-Event` — concrete event type
        - `X-Impreza-Event-Id` — unique event identifier (`evt_...`)
        - `X-Impreza-Delivery-Attempt` — delivery attempt counter

        The `secret` is returned **once** in the response. Store it securely;
        it cannot be retrieved later. Use `POST /webhooks/{id}/rotate-secret`
        to generate a new one.

        Subscriptions support wildcards: `vps.*` matches every VPS event,
        `*` matches everything.

        On creation, a `webhook.test` probe event is enqueued for delivery
        so you can verify your endpoint works.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, events]
              properties:
                url:
                  type: string
                  format: uri
                  maxLength: 500
                  example: https://example.com/hooks/impreza
                events:
                  type: array
                  minItems: 1
                  items:
                    type: string
                  example: [vps.*, invoice.paid, topup.paid]
                description:
                  type: string
                  maxLength: 200
                  example: production handler
      responses:
        '201':
          description: Subscription created — secret returned ONCE
          content:
            application/json:
              example:
                success: true
                data:
                  id: 1
                  url: https://example.com/hooks/impreza
                  events: [vps.*, invoice.paid, topup.paid]
                  description: production handler
                  is_active: true
                  last_delivery_at: null
                  last_delivery_status: null
                  created_at: '2026-05-08T16:00:00Z'
                  secret: a8f3...bcd9
                  secret_warning: 'Save this secret — it cannot be retrieved later. Rotate via POST /webhooks/{id}/rotate-secret.'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Subscription limit reached
          content:
            application/json:
              example:
                success: false
                error: { code: LIMIT_REACHED, message: 'Maximum of 10 webhook subscriptions per client.' }

  /webhooks/event-types:
    get:
      tags: [Webhooks]
      summary: List supported event types
      responses:
        '200':
          description: Event catalog with wildcard help
          content:
            application/json:
              example:
                success: true
                data:
                  event_types:
                    - webhook.test
                    - topup.paid
                    - invoice.created
                    - invoice.paid
                    - order.created
                    - service.activated
                    - service.suspended
                    - service.cancelled
                    - domain.registered
                    - domain.transferred
                    - domain.expiring_soon
                    - domain.expired
                    - vps.power_state_changed
                    - vps.backup_completed
                    - vps.snapshot_created
                    - vps.reinstall_completed
                  wildcards:
                    "*": Receive every event (catch-all).
                    "vps.*": Receive every event whose type starts with vps.
                    "domain.*": Receive every event whose type starts with domain.

  /webhooks/{id}:
    get:
      tags: [Webhooks]
      summary: Get a webhook subscription
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Subscription details
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Webhooks]
      summary: Update a webhook subscription
      description: Any subset of fields may be supplied; missing fields are unchanged.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  format: uri
                  maxLength: 500
                events:
                  type: array
                  items:
                    type: string
                description:
                  type: string
                  maxLength: 200
                is_active:
                  type: boolean
      responses:
        '200':
          description: Subscription updated
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Webhooks]
      summary: Delete a webhook subscription
      description: |
        Removes the subscription and discards any pending (undelivered)
        deliveries in the queue. Already delivered events keep their history.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Subscription deleted
          content:
            application/json:
              example:
                success: true
                data: { id: 1, deleted: true }
        '404':
          $ref: '#/components/responses/NotFound'

  /webhooks/{id}/rotate-secret:
    post:
      tags: [Webhooks]
      summary: Rotate the HMAC secret
      description: |
        Generates a fresh signing secret. The previous one becomes invalid
        immediately. New secret is returned ONCE.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: New secret returned
          content:
            application/json:
              example:
                success: true
                data:
                  id: 1
                  secret: f1a2...e90b
                  secret_warning: 'Save this secret — it cannot be retrieved later. The previous secret is now invalid.'
        '404':
          $ref: '#/components/responses/NotFound'

  /webhooks/{id}/deliveries:
    get:
      tags: [Webhooks]
      summary: List recent delivery attempts
      description: Returns the last 100 delivery attempts for this subscription.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Delivery history
          content:
            application/json:
              example:
                success: true
                data:
                  deliveries:
                    - id: 42
                      event_type: vps.power_state_changed
                      event_id: evt_a1b2c3
                      attempts: 1
                      next_attempt_at: '2026-05-08T16:01:00Z'
                      last_attempted_at: '2026-05-08T16:00:30Z'
                      last_response_code: 200
                      last_error: null
                      delivered: true
                      delivered_at: '2026-05-08T16:00:30Z'
                      created_at: '2026-05-08T16:00:00Z'
                  total: 1
        '404':
          $ref: '#/components/responses/NotFound'

  # ═══════════════════════════════════════════════════════
  # DOMAINS
  # ═══════════════════════════════════════════════════════

  /domains/pricing:
    get:
      tags: [Domains]
      summary: List TLD pricing
      description: |
        Returns all available TLDs with registration and renewal prices per year.
        Prices are shown in the authenticated client's currency.
      parameters:
        - name: tld
          in: query
          description: "Filter by TLD (comma-separated, e.g. `.com,.net,.io`)"
          schema:
            type: string
      responses:
        '200':
          description: TLD pricing list
          content:
            application/json:
              example:
                success: true
                data:
                  tlds:
                    - tld: ".com"
                      register: { "1": 12.99, "2": 25.98, "3": 38.97 }
                      renew: { "1": 14.99, "2": 29.98 }
                      currency: USD
                      min_years: 1
                      cheapest: 12.99
                    - tld: ".net"
                      register: { "1": 14.99 }
                      renew: { "1": 16.99 }
                      currency: USD
                      min_years: 1
                      cheapest: 14.99
                  total: 45
                  currency: USD

  /domains/register:
    post:
      tags: [Domains]
      summary: Register a new domain
      description: |
        Checks domain availability, verifies pricing and client balance,
        then creates a registration order and deducts from credit balance.
        Free DNS management is automatically activated upon successful registration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain, years]
              properties:
                domain:
                  type: string
                  example: "mynewdomain.com"
                years:
                  type: integer
                  minimum: 1
                  maximum: 10
                  example: 1
                nameservers:
                  type: array
                  items:
                    type: string
                  example: ["ns1.imprezahost.com", "ns2.imprezahost.com"]
      responses:
        '201':
          description: Domain registered
          content:
            application/json:
              example:
                success: true
                data:
                  order_id: 1234
                  invoice_id: 5678
                  domain: "mynewdomain.com"
                  years: 1
                  amount: 12.99
                  currency: USD
                  status: Registered
                  message: "Domain registration order created and paid from account balance."
        '409':
          description: Domain not available or insufficient balance
          content:
            application/json:
              examples:
                unavailable:
                  value:
                    success: false
                    error:
                      code: DOMAIN_UNAVAILABLE
                      message: "Domain mynewdomain.com is not available for registration."
                no_balance:
                  value:
                    success: false
                    error:
                      code: INSUFFICIENT_BALANCE
                      message: "Insufficient balance. Required: USD 12.99, Available: USD 0.00"

  /domains/transfer:
    post:
      tags: [Domains]
      summary: Transfer a domain
      description: |
        Transfer a domain from another registrar. Requires the EPP/auth code.
        Creates an order and deducts from credit balance.
        Free DNS management is automatically activated upon successful transfer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain, epp_code]
              properties:
                domain:
                  type: string
                  example: "existing-domain.com"
                epp_code:
                  type: string
                  description: EPP/Authorization code from current registrar
                  example: "abc123xyz"
                years:
                  type: integer
                  minimum: 1
                  default: 1
      responses:
        '201':
          description: Transfer order created
          content:
            application/json:
              example:
                success: true
                data:
                  order_id: 1235
                  invoice_id: 5679
                  domain: "existing-domain.com"
                  years: 1
                  amount: 12.99
                  currency: USD
                  message: "Domain transfer order created and paid from account balance."
        '409':
          description: Insufficient balance

  /domains/check:
    get:
      tags: [Domains]
      summary: Check domain availability
      description: Check availability of up to 10 domains at once.
      parameters:
        - name: domains
          in: query
          required: true
          description: Comma-separated list of domains
          schema:
            type: string
          example: "example.com,example.net,example.io"
      responses:
        '200':
          description: Availability results
          content:
            application/json:
              example:
                success: true
                data:
                  availability:
                    example.com: false
                    example.net: true
                    example.io: true

  /domains/{domain}:
    get:
      tags: [Domains]
      summary: Get domain details
      description: Full domain info including status, expiry, nameservers, lock status, EPP code, WHOIS privacy.
      parameters:
        - name: domain
          in: path
          required: true
          schema:
            type: string
          example: example.com
      responses:
        '200':
          description: Full domain details
        '403':
          $ref: '#/components/responses/Forbidden'

  /domains/{domain}/raa-verify:
    post:
      tags: [Domains]
      summary: Resend RAA verification email
      parameters:
        - name: domain
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Verification email resent

  /domains/{domain}/nameservers:
    put:
      tags: [Domains]
      summary: Update nameservers
      parameters:
        - name: domain
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nameservers]
              properties:
                nameservers:
                  type: array
                  items:
                    type: string
                  minItems: 2
                  example: ["ns1.imprezahost.com", "ns2.imprezahost.com"]
      responses:
        '200':
          description: Nameservers updated

  /domains/{domain}/lock:
    post:
      tags: [Domains]
      summary: Enable transfer lock
      parameters:
        - name: domain
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Transfer lock enabled

    delete:
      tags: [Domains]
      summary: Disable transfer lock
      description: Disables transfer lock and returns the EPP/auth code.
      parameters:
        - name: domain
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Transfer lock disabled
          content:
            application/json:
              example:
                success: true
                data:
                  epp_code: "abc123xyz"

  /domains/{domain}/dns/activate:
    post:
      tags: [Domains]
      summary: Activate DNS management
      description: Must be done before adding/editing DNS records.
      parameters:
        - name: domain
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: DNS management activated

  /domains/{domain}/dns:
    get:
      tags: [Domains]
      summary: List all DNS records
      parameters:
        - name: domain
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: DNS records
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - properties:
                      data:
                        type: object
                        properties:
                          records:
                            type: array
                            items:
                              $ref: '#/components/schemas/DnsRecord'

    post:
      tags: [Domains]
      summary: Add a DNS record
      parameters:
        - name: domain
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, host, value]
              properties:
                type:
                  type: string
                  enum: [A, AAAA, CNAME, MX, TXT, NS, SRV]
                host:
                  type: string
                  example: "@"
                value:
                  type: string
                  example: "185.100.86.42"
                ttl:
                  type: integer
                  default: 14400
                priority:
                  type: integer
                  description: Required for MX records
      responses:
        '201':
          description: Record created

    put:
      tags: [Domains]
      summary: Update a DNS record
      parameters:
        - name: domain
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, host, old_value, new_value]
              properties:
                type:
                  type: string
                  enum: [A, AAAA, CNAME, MX, TXT, NS, SRV]
                host:
                  type: string
                old_value:
                  type: string
                new_value:
                  type: string
                ttl:
                  type: integer
                  default: 14400
                priority:
                  type: integer
      responses:
        '200':
          description: Record updated

    delete:
      tags: [Domains]
      summary: Delete a DNS record
      parameters:
        - name: domain
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, host, value]
              properties:
                type:
                  type: string
                host:
                  type: string
                value:
                  type: string
      responses:
        '200':
          description: Record deleted

  /domains/{domain}/gdpr-auth:
    post:
      tags: [Domains]
      summary: Resend GDPR authorization email
      parameters:
        - name: domain
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: GDPR auth email resent

  /domains/{domain}/transfer-approval:
    post:
      tags: [Domains]
      summary: Resend transfer approval email
      parameters:
        - name: domain
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Transfer approval email resent

  /domains/{domain}/id-protection:
    post:
      tags: [Domains]
      summary: Purchase ID Protection
      description: |
        Activates ID Protection (WHOIS Privacy) for a registered domain.
        Creates an invoice and pays from account credit balance.
        Price is based on the TLD addon pricing configured in the system.
      parameters:
        - name: domain
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: ID Protection activated
          content:
            application/json:
              example:
                success: true
                data:
                  domain: example.com
                  domain_id: 456
                  invoice_id: 7890
                  amount: 2.99
                  currency: USD
                  message: "ID Protection activated and paid from account balance."
        '409':
          description: Already active or insufficient balance
          content:
            application/json:
              examples:
                already_active:
                  value:
                    success: false
                    error:
                      code: ALREADY_ACTIVE
                      message: "ID Protection is already active for this domain."
                insufficient_balance:
                  value:
                    success: false
                    error:
                      code: INSUFFICIENT_BALANCE
                      message: "Insufficient balance. Required: USD 2.99, Available: USD 0.50"

