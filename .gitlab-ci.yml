# Impreza DevKit CI Pipeline
#
# Stages:
#   - validate: lint OpenAPI spec, run pre-commit checks
#   - test:     run pytest for SDK and CLI
#   - build:    build sdist + wheel for both packages
#   - publish:  push to PyPI on tagged releases (master only)
#
# Public mirror to GitHub is configured via GitLab UI (Settings > Repository >
# Mirroring repositories) — not via CI.

stages:
  - validate
  - test
  - build
  - publish

default:
  image: python:3.11-slim
  before_script:
    - python -m pip install --upgrade pip

# ─────────────────────────── Validate ────────────────────────────

openapi:lint:
  stage: validate
  image: stoplight/spectral:latest
  script:
    - spectral lint openapi/openapi.yaml --fail-severity=warn
  rules:
    - changes:
        - openapi/**/*

precommit:
  stage: validate
  script:
    - pip install pre-commit
    - pre-commit run --all-files
  allow_failure: true

# ────────────────────────────── Test ─────────────────────────────

sdk:test:
  stage: test
  script:
    - cd sdk-python
    - pip install -e ".[test]"
    - pytest -v --cov=impreza tests/
  rules:
    - changes:
        - sdk-python/**/*
        - openapi/**/*

cli:test:
  stage: test
  script:
    - cd cli-python
    - pip install -e ".[test]"
    - pytest -v tests/
  rules:
    - changes:
        - cli-python/**/*
        - openapi/**/*

# ────────────────────────────── Build ────────────────────────────

sdk:build:
  stage: build
  script:
    - cd sdk-python
    - pip install build
    - python -m build
  artifacts:
    paths:
      - sdk-python/dist/
    expire_in: 1 week

cli:build:
  stage: build
  script:
    - cd cli-python
    - pip install build
    - python -m build
  artifacts:
    paths:
      - cli-python/dist/
    expire_in: 1 week

# ───────────────────────────── Publish ───────────────────────────

sdk:publish:
  stage: publish
  script:
    - pip install twine
    - twine upload sdk-python/dist/*
  rules:
    - if: '$CI_COMMIT_TAG =~ /^sdk-v\d+\.\d+\.\d+$/'

cli:publish:
  stage: publish
  script:
    - pip install twine
    - twine upload cli-python/dist/*
  rules:
    - if: '$CI_COMMIT_TAG =~ /^cli-v\d+\.\d+\.\d+$/'
