# Build the locked Caddy application and publish its reviewed image.
# The -cf suffix is a compatibility name; DNS uses the Impreza provider.
name: Build + push Caddy image

on:
  push:
    tags:
      - 'caddy-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Caddy version to build (e.g. 2.11.4). The image tags will use this verbatim.'
        required: true

permissions:
  contents: read
  packages: write  # push to ghcr.io

jobs:
  build-push:
    name: Audit and publish multi-arch Caddy with Impreza DNS
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up reviewed Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache-dependency-path: agent-go/packaging/caddy/application/go.sum

      - name: Audit the complete Caddy application
        working-directory: agent-go/packaging/caddy/application
        env:
          GOTOOLCHAIN: go1.26.6
          GOWORK: 'off'
          CGO_ENABLED: '0'
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          go mod verify
          govulncheck ./...
          git diff --exit-code -- go.mod go.sum

      - name: Resolve version
        id: ver
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        # tag-triggered: GITHUB_REF_NAME is e.g. `caddy-v2.11.4`, strip
        # the `caddy-v` prefix → `2.11.4`.
        # manual: just use the dispatch input.
        # A `-sN` suffix (e.g. `2.11.4-s1`) is a Shield build that agents pin
        # by digest. It publishes only its exact tag and never moves the
        # `2-cf`/`latest-cf` streams that earlier agents still follow.
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF_NAME#caddy-v}"
          fi
          if [[ "$VERSION" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-s[0-9]+$ ]]; then
            CADDY="${BASH_REMATCH[1]}"
            TAGS="ghcr.io/imprezahost/caddy:${VERSION}"
          elif [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            CADDY="$VERSION"
            TAGS="$(printf '%s\n' "ghcr.io/imprezahost/caddy:${VERSION}-cf" \
              "ghcr.io/imprezahost/caddy:2-cf" "ghcr.io/imprezahost/caddy:latest-cf")"
          else
            echo "FATAL: expected X.Y.Z or X.Y.Z-sN version"; exit 1
          fi
          {
            echo "version=$VERSION"
            echo "caddy=$CADDY"
            echo "tags<<TAGS_EOF"
            echo "$TAGS"
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved Caddy $CADDY; image tags:" $TAGS

      - name: Set up QEMU (arm64 emulation for cross-build)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          # `github.actor` works for both tag-push and workflow_dispatch.
          # GITHUB_TOKEN with `packages: write` (granted above) is
          # auto-scoped to the repo's owner namespace, so pushes go to
          # ghcr.io/<repo-owner>/... without extra setup.
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          # Build context = repo root so the Dockerfile can COPY the
          # caddy-dns-impreza/ subdir (the bundled libdns plugin).
          # The Dockerfile lives in agent-go/packaging/caddy/ for
          # discoverability but its COPY paths are relative to root.
          context: .
          file: agent-go/packaging/caddy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            CADDY_VERSION=${{ steps.ver.outputs.caddy }}
          # A plain X.Y.Z build publishes three tags: version, major-version
          # stream and latest. The major-version stream (`2-cf`) is what
          # agents up to 0.6.21 use, so such a release auto-rolls out to
          # their fresh installs. Existing containers retain their image.
          # Updating requires a reviewed pull and container recreation that
          # preserves proxy state and credentials; docker restart alone keeps
          # the old image. A Shield build (X.Y.Z-sN) publishes its exact tag
          # only; agents from 0.6.22 pin that image by digest.
          tags: ${{ steps.ver.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/imprezahost/impreza-devkit
            org.opencontainers.image.description=Caddy ${{ steps.ver.outputs.caddy }} with the Impreza DNS provider and Impreza Shield
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.revision=${{ github.sha }}
