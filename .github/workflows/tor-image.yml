# GitHub Actions: build + push the impreza/tor hidden-service image.
#
# Mirrors caddy-image.yml. The image is the official Debian base + tor from
# the Tor Project's apt repo — we never package Tor ourselves (see
# agent-go/packaging/tor/README.md).
#
# Triggers:
#   - Tag push matching `tor-v<X>` (e.g. `tor-v1.1.0`) — cuts a new image
#     release for base/entrypoint changes.
#   - Manual `workflow_dispatch`.
#
# Output tags (multi-arch linux/amd64 + linux/arm64):
#   - ghcr.io/imprezahost/tor:<X>   (version alias)
#   - ghcr.io/imprezahost/tor:1     (major stream alias)
#   - ghcr.io/imprezahost/tor:latest
# Release agents must use the verified multiarchitecture manifest digest.
#
# Tor package patches do NOT need a new image: the entrypoint apt-upgrades
# tor from deb.torproject.org on every container start.

name: Build + push impreza/tor image

on:
  push:
    tags:
      - 'tor-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Image version (e.g. 1.1.0). Bump for base/entrypoint changes, not for tor patches.'
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    name: Build + push multi-arch impreza/tor
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        env:
          REQUESTED_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="$REQUESTED_VERSION"
          else
            VERSION="${GITHUB_REF_NAME#tor-v}"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "FATAL: expected a semantic image version"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved tor image version: $VERSION"

      - name: Set up QEMU (arm64 emulation for cross-build)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: agent-go/packaging/tor/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/imprezahost/tor:${{ steps.ver.outputs.version }}
            ghcr.io/imprezahost/tor:1
            ghcr.io/imprezahost/tor:latest
          labels: |
            org.opencontainers.image.source=https://github.com/imprezahost/impreza-devkit
            org.opencontainers.image.description=Tor hidden-service daemon for impreza-agent (Debian + deb.torproject.org, self-updating entrypoint)
            org.opencontainers.image.licenses=BSD-3-Clause
            org.opencontainers.image.revision=${{ github.sha }}
