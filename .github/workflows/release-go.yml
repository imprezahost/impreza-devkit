# Audited archives are uploaded once, to a draft release, then published.
# This workflow only verifies the resulting public downloads.
name: Verify impreza-cli-go release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published cli-go-vX.Y.Z tag to verify (no uploads)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: verify-cli-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'cli-go-v')
    name: Verify published archives
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out verifier
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test release verification
        run: node --test .github/scripts/verify-cli-release.test.mjs
      - name: Verify public release
        run: node .github/scripts/verify-cli-release.mjs
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          GITHUB_TOKEN: ${{ github.token }}
